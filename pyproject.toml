[project]
name = "yolo26n-vrc-mocap"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
# Lite edition (default `uv sync`): MediaPipe Pose/Face/Hand only, no PyTorch.
dependencies = [
    "opencv-python==4.13.0.92",
    # mediapipe depends on unpinned opencv-contrib-python; both share cv2/, keep them identical.
    "opencv-contrib-python==4.13.0.92",
    "mediapipe==0.10.33",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "flask==3.1.0",
    "python-osc==1.10.2",
    "PyYAML==6.0.3",
    "psutil==7.2.2",
    "openvr==2.12.1401",
]

[project.optional-dependencies]
# Full edition (`uv sync --extra full`): adds the YOLO pose backend.
full = [
    "ultralytics==8.4.51",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[dependency-groups]
build = ["pyinstaller==6.19.0"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true